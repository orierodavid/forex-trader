name: Forex Signal Bot

on:
  schedule:
    # 4H candles close 6x/day. Adjust these hours if your data feed's
    # 4H candles close at different times than these UTC hours.
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        run: python3 forex_signal_bot.py
