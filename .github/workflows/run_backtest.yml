name: Run Backtest

on:
  workflow_dispatch: {}   # no schedule — only runs when you click "Run workflow"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run backtest
        run: python3 backtest_strategy.py
